name: Embedded C CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build project
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Debug coverage files
        run: |
          echo "Current directory:"
          pwd

          echo "Build directory:"
          ls -la build

          echo "Coverage files:"
          find . -type f \( -name "*.gcno" -o -name "*.gcda" \)

      - name: Find coverage files
        run: |
            find build -type f \( -name "*.gcno" -o -name "*.gcda" \)  


      - name: Generate coverage report
        run: |
            find build -name "button.c.gcno" -exec gcov -b -c {} \;
            find build -name "gpio.c.gcno" -exec gcov -b -c {} \;
